<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Delicious Recipes – CraveReel</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg rr-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <div class="brand-icon"><i class="bi bi-play-circle-fill"></i></div>
        <span>Crave<span class="brand-accent">Reel</span></span>
      </a>

      <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <i class="bi bi-list fs-2"></i>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-1">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="explore.html"><i class="bi bi-compass"></i> Explore</a></li>
          <li class="nav-item"><a class="nav-link reels-badge-link" href="reels.html"><i class="bi bi-camera-reels-fill"></i> Reels</a></li>
          <li class="nav-item"><a class="nav-link" href="saved.html"><i class="bi bi-bookmark-heart"></i> Saved</a></li>
        </ul>

        <!-- Auth Section -->
        <div id="auth-nav-section" class="d-flex align-items-center"></div>
      </div>
    </div>
  </nav>

  <!-- Explorer Header & Search Bar -->
  <div class="py-5 border-bottom" style="background: radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.1), transparent 60%); border-color: var(--border-color) !important;">
    <div class="container text-center">
      <h1 class="fw-extrabold text-white mb-2">Explore Culinary Masterpieces</h1>
      <p class="text-secondary small mb-4">Search by recipe name, ingredient, diet, cooking time, or creator.</p>

      <div class="max-w-700 mx-auto position-relative">
        <div class="input-group input-group-lg shadow-lg">
          <span class="input-group-text bg-dark border-secondary border-opacity-25 text-warning ps-4">
            <i class="bi bi-search"></i>
          </span>
          <input type="text" id="exploreSearchInput" class="form-control bg-dark border-secondary border-opacity-25 text-white" placeholder="Search paneer, pasta, chicken, chocolate..." oninput="handleSearchInput(event)">
          <button class="btn btn-rr-primary px-4" type="button" onclick="triggerFilter()">Search</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Explorer Layout -->
  <div class="container py-5">
    <div class="row g-4">

      <!-- Left Filters Sidebar -->
      <div class="col-lg-3">
        <div class="rr-dashboard-card position-sticky" style="top: 85px;">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold text-white mb-0"><i class="bi bi-sliders text-warning me-2"></i> Filters</h6>
            <button class="btn btn-sm btn-link text-muted p-0 text-decoration-none" onclick="resetFilters()">Reset All</button>
          </div>

          <!-- Category Filter -->
          <div class="mb-4">
            <label class="form-label">Category</label>
            <select id="filterCategory" class="form-select form-select-sm" onchange="triggerFilter()">
              <option value="">All Categories</option>
            </select>
          </div>

          <!-- Dietary Preference Filter -->
          <div class="mb-4">
            <label class="form-label">Dietary Preference</label>
            <div class="d-flex flex-column gap-2">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="dietRadio" id="dietAll" value="" checked onchange="triggerFilter()">
                <label class="form-check-label text-secondary small" for="dietAll">All Diets</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="dietRadio" id="dietVeg" value="true" onchange="triggerFilter()">
                <label class="form-check-label text-secondary small" for="dietVeg">🌱 Vegetarian Only</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="dietRadio" id="dietNonVeg" value="false" onchange="triggerFilter()">
                <label class="form-check-label text-secondary small" for="dietNonVeg">🍗 Non-Vegetarian</label>
              </div>
            </div>
          </div>

          <!-- Difficulty Filter -->
          <div class="mb-4">
            <label class="form-label">Difficulty</label>
            <select id="filterDifficulty" class="form-select form-select-sm" onchange="triggerFilter()">
              <option value="ALL">Any Difficulty</option>
              <option value="EASY">Easy</option>
              <option value="MEDIUM">Medium</option>
              <option value="HARD">Hard</option>
            </select>
          </div>

          <!-- Cooking Time Filter -->
          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label mb-0">Max Cooking Time</label>
              <span class="small text-warning fw-bold" id="cookTimeDisplay">All</span>
            </div>
            <input type="range" class="form-range" id="filterCookTime" min="10" max="90" step="10" value="90" oninput="updateCookTimeLabel(this.value)" onchange="triggerFilter()">
            <div class="d-flex justify-content-between text-muted" style="font-size: 0.7rem;">
              <span>10m</span>
              <span>30m</span>
              <span>60m</span>
              <span>Any</span>
            </div>
          </div>

          <!-- Sort Order -->
          <div>
            <label class="form-label">Sort By</label>
            <select id="filterSort" class="form-select form-select-sm" onchange="triggerFilter()">
              <option value="newest">Newest Added</option>
              <option value="popular">Most Popular / Views</option>
              <option value="rating">Highest Rated</option>
              <option value="quickest">Quickest Prep Time</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Right Recipes Grid -->
      <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="text-secondary small">
            Found <span class="fw-bold text-white" id="resultsCount">0</span> delicious recipes
          </div>
          <div class="d-flex align-items-center gap-2">
            <a href="reels.html" class="btn btn-sm btn-outline-warning">
              <i class="bi bi-play-circle-fill"></i> Watch Reels Instead
            </a>
          </div>
        </div>

        <div class="row g-4" id="exploreRecipesGrid">
          <!-- Dynamically Injected -->
          <div class="col-12 text-center py-5 text-muted">
            <div class="spinner-border text-warning spinner-border-sm" role="status"></div> Loading recipes...
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Mobile Bottom Navigation -->
  <div class="mobile-bottom-nav">
    <a href="index.html" class="mobile-nav-item"><i class="bi bi-house-door-fill"></i><span>Home</span></a>
    <a href="explore.html" class="mobile-nav-item active"><i class="bi bi-compass-fill"></i><span>Explore</span></a>
    <a href="reels.html" class="mobile-nav-item text-warning"><i class="bi bi-camera-reels-fill"></i><span>Reels</span></a>
    <a href="saved.html" class="mobile-nav-item"><i class="bi bi-bookmark-heart"></i><span>Saved</span></a>
    <a href="login.html" class="mobile-nav-item"><i class="bi bi-person-circle"></i><span>Profile</span></a>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/explore.js"></script>
</body>
</html>
