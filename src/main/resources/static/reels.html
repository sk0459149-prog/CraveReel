<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooking Reels – CraveReel</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/reels.css">
</head>
<body style="background: #000; overflow: hidden;">

  <!-- Minimal Dark Header for Reels -->
  <nav class="navbar navbar-dark bg-dark py-2 px-3 border-bottom border-secondary border-opacity-10" style="height: 60px; z-index: 1000;">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="btn btn-sm btn-outline-secondary rounded-circle" title="Back to Home">
          <i class="bi bi-arrow-left text-white"></i>
        </a>
        <a class="navbar-brand m-0 fs-5 d-flex align-items-center gap-2" href="index.html">
          <div class="brand-icon" style="width: 32px; height: 32px; font-size: 1rem;"><i class="bi bi-play-circle-fill"></i></div>
          <span>Crave<span class="brand-accent">Reel</span></span>
        </a>
      </div>

      <div class="d-none d-md-flex align-items-center gap-3 text-secondary small">
        <span><i class="bi bi-arrow-up-circle"></i> / <i class="bi bi-arrow-down-circle"></i> Scroll to navigate</span>
        <span><i class="bi bi-volume-up"></i> Tap anywhere to unmute</span>
      </div>

      <!-- Auth Section -->
      <div id="auth-nav-section" class="d-flex align-items-center"></div>
    </div>
  </nav>

  <!-- Reels Main Container -->
  <div class="reels-page-wrapper" style="height: calc(100vh - 60px);">
    <div class="reels-layout-container">

      <!-- Vertical Reel Scroll Feed -->
      <div class="reels-feed" id="reelsFeed">
        <!-- Injected via reels.js -->
        <div class="d-flex justify-content-center align-items-center h-100 text-muted">
          <div class="spinner-border text-warning" role="status"></div>
          <span class="ms-2">Loading cooking reels...</span>
        </div>
      </div>

      <!-- Desktop Companion Panel (Ingredients, Related, Cook Launch) -->
      <aside class="reels-side-panel d-none d-lg-flex" id="reelsSidePanel">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3" style="border-color: var(--border-color) !important;">
          <h5 class="fw-bold text-white mb-0" id="sidePanelRecipeTitle">Recipe Overview</h5>
          <span class="badge bg-warning bg-opacity-20 text-warning" id="sidePanelCategory">Category</span>
        </div>

        <!-- Meta Summary -->
        <div class="d-flex justify-content-between text-center p-3 rounded-3" style="background: rgba(0, 0, 0, 0.25);">
          <div>
            <div class="small text-muted">Prep Time</div>
            <div class="fw-bold text-white" id="sidePanelPrep">10 mins</div>
          </div>
          <div class="vr bg-secondary opacity-25"></div>
          <div>
            <div class="small text-muted">Cook Time</div>
            <div class="fw-bold text-white" id="sidePanelCook">20 mins</div>
          </div>
          <div class="vr bg-secondary opacity-25"></div>
          <div>
            <div class="small text-muted">Difficulty</div>
            <div class="fw-bold text-white" id="sidePanelDifficulty">Easy</div>
          </div>
        </div>

        <!-- Dynamic Ingredients Preview -->
        <div>
          <h6 class="fw-bold text-white mb-2 d-flex align-items-center justify-content-between">
            <span><i class="bi bi-basket2 text-warning me-1"></i> Key Ingredients</span>
            <span class="small text-muted fw-normal" id="sidePanelIngCount">0 items</span>
          </h6>
          <ul class="list-group list-group-flush small" id="sidePanelIngredientsList" style="max-height: 200px; overflow-y: auto;">
            <!-- Injected via reels.js -->
          </ul>
        </div>

        <!-- CTA Actions -->
        <div class="mt-auto d-flex flex-column gap-2 pt-3 border-top" style="border-color: var(--border-color) !important;">
          <a href="#" id="sidePanelCookThisBtn" class="btn btn-cook-this justify-content-center py-2">
            🍳 Cook This (Full Recipe)
          </a>
          <a href="#" id="sidePanelCookingModeBtn" class="btn btn-rr-primary justify-content-center py-2">
            <i class="bi bi-play-circle-fill"></i> Start Cooking Mode
          </a>
        </div>
      </aside>

    </div>
  </div>

  <!-- Reel Comments Drawer (Slide-up bottom sheet) -->
  <div class="reel-comment-drawer" id="reelCommentDrawer">
    <div class="comment-drawer-header">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-chat-left-text-fill text-warning"></i>
        <span class="text-white">Comments (<span id="drawerCommentCount">0</span>)</span>
      </div>
      <button class="btn-close btn-close-white" onclick="closeCommentDrawer()"></button>
    </div>

    <div class="comment-drawer-body" id="drawerCommentsBody">
      <!-- Injected via reels.js -->
    </div>

    <div class="comment-drawer-footer">
      <form id="drawerCommentForm" onsubmit="handleDrawerCommentSubmit(event)">
        <div class="input-group">
          <input type="text" id="drawerCommentInput" class="form-control" placeholder="Add a comment or ask the chef..." required>
          <button class="btn btn-rr-primary" type="submit">Post</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reels.js"></script>
</body>
</html>
